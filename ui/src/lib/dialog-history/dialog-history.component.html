<sotbi-side-panel>
  <h3 panelTitle class="modal-title">
    {{ inputData.title }}
  </h3>
  @if (hideModal) {
    <h3 class="modal-title">Изменений нет</h3>
  } @else {
    <div class="modal-body modal-box">
      <table class="table table-compact history-table">
        <thead>
          <tr>
            <th class="left">Информация</th>
            <th class="left">Было</th>
            <th class="left">Стало</th>
          </tr>
        </thead>
        <tbody>
          @for (key of keys; track $index) {
            @if (!$last) {
              <tr>
                <td class="left">{{ key }}</td>
                <td class="left">{{ values[$index] || '-' }}</td>
                <td class="left">{{ valuesNew[$index] || '-' }}</td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  }
  <div panelActions class="modal-footer">
    <button
      class="btn btn-primary btn-sm"
      type="button"
      (click)="dialogRef.requestClose()"
    >
      Закрыть
    </button>
  </div>
</sotbi-side-panel>
