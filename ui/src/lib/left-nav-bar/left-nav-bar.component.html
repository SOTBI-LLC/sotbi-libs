@if (countWithChildren(items()) > 1) {
  <nav
    sotbiVerticalNav
    [multiExpandable]="true"
    [collapsible]="colabsible()"
    [libNavLevel]="2"
    class="nav-trigger--bottom"
    aria-label="Разделы"
  >
    @for (item of items(); track item.routerLink ?? item.label) {
      @if (item.children && item.children.length > 0) {
        <div
          sotbiVerticalNavGroup
          routerLinkActive="active"
          [initiallyExpanded]="item.expanded ?? false"
        >
          <clr-icon
            sotbiNavGroupIcon
            class="nav-icon"
            [shape]="item.icon ?? ''"
          />
          <span sotbiNavGroupLabel>{{ item.label }}</span>
          @for (child of item.children; track child.routerLink) {
            <a
              class="nav-link"
              [routerLink]="child.routerLink ?? '/'"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
            >
              @if (child.icon) {
                <clr-icon class="nav-icon" [shape]="child.icon" />
              }
              <span class="nav-text">{{ child.label }}</span>
            </a>
          }
        </div>
      } @else {
        <a
          class="nav-link"
          [routerLink]="item.routerLink ?? '/'"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          <clr-icon class="nav-icon" [shape]="item.icon ?? ''" />
          <span class="nav-text">{{ item.label }}</span>
        </a>
      }
    }
  </nav>
}
