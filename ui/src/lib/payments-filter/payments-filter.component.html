<form class="payments-filter-form" [formGroup]="filterForm">
  <div class="payments-filter-field">
    <ng-select
      [multiple]="true"
      [clearable]="true"
      name="label"
      id="label"
      [items]="labels()"
      bindLabel="name"
      bindValue="id"
      notFoundText="Не найдено"
      placeholder="Выберите операции"
      formControlName="label_id"
      (clear)="onLabelIDClear()"
      (change)="onLabelIDChanged($event)"
    ></ng-select>
  </div>
  <div class="payments-filter-field">
    <ng-select
      [multiple]="true"
      [clearable]="true"
      name="accounts"
      id="accounts"
      [items]="actuals()"
      bindLabel="name"
      bindValue="id"
      notFoundText="Не найдено"
      placeholder="Выберите счет"
      formControlName="bank_detail_id"
      (clear)="onBankDetailIDClear()"
      (change)="onBankDetailIDChanged($event)"
    ></ng-select>
  </div>
  <div class="payments-filter-period">
    <div class="payments-filter-period-select">
      <label for="options" class="clr-control-label">Период</label>
      <select
        class="form-control"
        id="options"
        formControlName="between"
        (change)="filterByDateBetween(filterForm.controls['between'].value ?? beetwenType.TODAY)"
      >
        <option [ngValue]="beetwenType.TODAY">Платежи за сегодня</option>
        <option [ngValue]="beetwenType.CURR_WEEK">Платежи за текущую неделю</option>
        <option [ngValue]="beetwenType.LAST_7DAYS">Платежи за последние 7 дней</option>
        <option [ngValue]="beetwenType.CURR_MONTH">Платежи за текущий месяц</option>
        <option [ngValue]="beetwenType.LAST_MONTH">Платежи за последний месяц</option>
        <option [ngValue]="beetwenType.CUSTOM">Указать диапазон вручную</option>
      </select>
    </div>
    @if (between() === beetwenType.CUSTOM) {
      <div class="payments-filter-period-dates">
        <div class="payments-filter-date">
          <label for="start" class="clr-control-label">с</label>
          <input
            type="date"
            class="w-100"
            nativeDate
            id="start"
            name="start"
            formControlName="start"
            (change)="onCustomDateChange()"
          />
        </div>
        <div class="payments-filter-date">
          <label for="end" class="clr-control-label">по</label>
          <input
            type="date"
            nativeDate
            class="w-100"
            id="end"
            name="end"
            formControlName="end"
            (change)="onCustomDateChange()"
          />
        </div>
      </div>
    }
  </div>
</form>
