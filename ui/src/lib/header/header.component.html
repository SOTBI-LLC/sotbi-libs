@if (loggedIn()) {
  <header class="header">
    @if (shell?.levels()?.has(1)) {
      <button
        type="button"
        class="header-hamburger-trigger"
        [attr.aria-label]="
          shell?.openLevel() === 1 ? 'Close navigation' : 'Open navigation'
        "
        [attr.aria-expanded]="shell?.openLevel() === 1"
        [attr.aria-controls]="shell?.levels()?.get(1)?.id"
        (click)="openNavigation(1, $event)"
      >
        <span></span>
      </button>
    }
    <div class="branding">
      <a [routerLink]="brand().homeLink" class="nav-link">
        <img
          class="logo"
          [src]="brand().logoUrl"
          title="logo"
          alt=""
          width="40"
          height="40"
        /><span class="title">{{ brand().title }}</span>
      </a>
    </div>
    <div class="header-nav" [libNavLevel]="1">
      @for (item of items(); track item.routerLink) {
        <a
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          class="nav-link nav-text"
          >{{ item.label }}</a
        >
      }
    </div>
    @if (showSearch()) {
      <form
        #searchForm="ngForm"
        class="search"
        (ngSubmit)="submitSearch(searchinput.value)"
      >
        <label for="searchinput">
          <input
            class="focus-item"
            id="searchinput"
            name="searchinput"
            [value]="phrase()"
            #searchinput
            type="text"
            placeholder="Поиск"
            (keyup)="onKeyUp(searchinput.value)"
          />
        </label>
      </form>
    }
    <div class="header-actions">
      <div
        class="dropdown w-45r pl-8px"
        [class.open]="dropdownTrigger0.isOpen()"
      >
        <button
          class="dropdown-toggle nav-icon w-100"
          style="height: 100%"
          #dropdownTrigger0="cdkMenuTriggerFor"
          [cdkMenuTriggerFor]="dropdownMenu0"
          [cdkMenuPosition]="[
            {
              originX: 'end',
              originY: 'bottom',
              overlayX: 'end',
              overlayY: 'top',
              offsetY: 2,
            },
            {
              originX: 'start',
              originY: 'bottom',
              overlayX: 'start',
              overlayY: 'top',
              offsetY: 2,
            },
            {
              originX: 'end',
              originY: 'top',
              overlayX: 'end',
              overlayY: 'bottom',
              offsetY: -2,
            },
            {
              originX: 'start',
              originY: 'top',
              overlayX: 'start',
              overlayY: 'bottom',
              offsetY: -2,
            },
          ]"
          aria-label="toggle settings menu"
        >
          <img
            title="avatar"
            [src]="user()?.avatarUrl"
            [alt]="user()?.name"
            class="avatar"
          />
          <svg lucideChevronUp data-direction="down"></svg>
        </button>
        <ng-template #dropdownMenu0
          ><div class="dropdown open">
            <div
              cdkMenu
              class="dropdown-menu"
              style="position: static; display: block; margin: 0"
            >
              <!-- Заголовок меню Clarity, не связанный с полем формы -->
              <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -->
              <label class="dropdown-header" aria-hidden="true">{{
                user()?.name
              }}</label>
              @for (item of accountItems(); track item.routerLink) {
                <a
                  [routerLink]="item.routerLink"
                  cdkMenuItem
                  libAccountMenuLinkSpace
                  class="dropdown-item"
                  >{{ item.label }}</a
                >
              }
              <button
                type="button"
                title="logout"
                cdkMenuItem
                class="dropdown-item"
                (cdkMenuItemTriggered)="logoutRequested.emit()"
              >
                Выход
              </button>
            </div>
          </div></ng-template
        >
      </div>
    </div>
    @if (shell?.levels()?.has(2)) {
      <button
        type="button"
        class="header-overflow-trigger"
        [attr.aria-label]="
          shell?.openLevel() === 2
            ? 'Close navigation overflow menu'
            : 'Open navigation overflow menu'
        "
        [attr.aria-expanded]="shell?.openLevel() === 2"
        [attr.aria-controls]="shell?.levels()?.get(2)?.id"
        (click)="openNavigation(2, $event)"
      >
        <span></span>
      </button>
    }
    <button
      type="button"
      class="header-backdrop"
      tabindex="-1"
      aria-label="Close navigation"
      (click)="shell?.close()"
    ></button>
  </header>
}
