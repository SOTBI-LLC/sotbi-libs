<div class="btn-group">
  <button
    class="btn btn-sm btn-icon"
    title="Скачать файл"
    aria-label="Скачать файл"
    [sotbiLoading]="uploadState()"
    [disabled]="uploadState() === loadingState.LOADING"
    (click)="download()"
  >
    <svg lucideCloudDownload></svg>
  </button>
  <button
    class="btn btn-sm btn-icon"
    title="Загрузить файл"
    aria-label="Загрузить файл"
    [sotbiLoading]="uploadState()"
    [disabled]="uploadState() === loadingState.LOADING"
    (click)="file.click()"
  >
    <svg lucideCloudUpload></svg>
  </button>
  <input
    type="file"
    name="file"
    id="file"
    multiple
    #file
    style="display: none"
    (change)="upload(file)"
  />
</div>
