<sotbi-side-panel presentation="modal">
  <h3 panelTitle>Есть несохранённые изменения</h3>
  <div panelBody>
    <p>Есть несохраненные изменения.</p>
  </div>
  <div class="dialog-actions" panelActions>
    <div class="action-buttons">
      <button
        type="button"
        (click)="close()"
        class="btn btn-outline action-buttons__item"
      >
        Продолжить редактирование
      </button>
      <button
        type="button"
        (click)="cancelSave()"
        class="btn btn-outline action-buttons__item"
      >
        Не сохранять
      </button>
      <button
        (click)="save()"
        [disabled]="!inputData.canBeSaved"
        class="btn btn-primary action-buttons__item action-buttons__save-btn"
      >
        <span class="action-buttons__check-icon-wrap">✓</span>
        Сохранить
      </button>
    </div>
  </div>
</sotbi-side-panel>
